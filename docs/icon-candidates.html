<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창 투명도 조절기 — 렌즈 아이콘 후보</title>
<style>
  :root{ --ink:#1f1f1f; --sub:#6b7177; --line:#e2e5e8; --bg:#f4f6f8; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Malgun Gothic","맑은 고딕",Segoe UI,system-ui,sans-serif;padding:28px 24px 48px}
  header{max-width:900px;margin:0 auto 22px}
  h1{font-size:21px;margin:0 0 6px;letter-spacing:-.2px}
  .sub{color:var(--sub);font-size:13px;margin:0;line-height:1.5}
  .grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center}
  .num{align-self:flex-start;font-size:12px;font-weight:700;color:#fff;background:#1f1f1f;
    width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
  .big{width:92px;height:92px;display:block;color:#1f1f1f}
  .name{font-size:14px;font-weight:700;margin:12px 0 2px;text-align:center}
  .desc{font-size:11.5px;color:var(--sub);text-align:center;line-height:1.45;min-height:30px}
  .previews{display:flex;gap:8px;margin-top:12px}
  .chip{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:9px}
  .chip.light{background:#fff;border:1px solid var(--line);color:#1f1f1f}
  .chip.dark{background:#2b2b2b;color:#f0f0f0}
  .chip .s32{width:32px;height:32px;display:block}
  .chip .s16{width:16px;height:16px;display:block}
  footer{max-width:900px;margin:26px auto 0;color:var(--sub);font-size:13px;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;line-height:1.5}
  footer b{color:var(--ink)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 1. 링 (순수 원) -->
    <symbol id="ic1" viewBox="0 0 128 128">
      <circle cx="64" cy="64" r="46" fill="none" stroke="currentColor" stroke-width="7"/>
    </symbol>
    <!-- 2. 이중 링 -->
    <symbol id="ic2" viewBox="0 0 128 128">
      <circle cx="64" cy="64" r="46" fill="none" stroke="currentColor" stroke-width="7"/>
      <circle cx="64" cy="64" r="30" fill="none" stroke="currentColor" stroke-width="3.5"/>
    </symbol>
    <!-- 3. 오목 면 (안쪽 곡면 힌트) -->
    <symbol id="ic3" viewBox="0 0 128 128">
      <circle cx="64" cy="64" r="46" fill="none" stroke="currentColor" stroke-width="7"/>
      <ellipse cx="64" cy="64" rx="16" ry="40" fill="none" stroke="currentColor" stroke-width="3.5"/>
    </symbol>
    <!-- 4. 링 + 광택 -->
    <symbol id="ic4" viewBox="0 0 128 128">
      <circle cx="64" cy="64" r="46" fill="none" stroke="currentColor" stroke-width="7"/>
      <path d="M40 56 A 30 30 0 0 1 56 40" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <!-- 5. 볼록 렌즈 (렌틸 실루엣) -->
    <symbol id="ic5" viewBox="0 0 128 128">
      <path d="M22 64 Q64 26 106 64 Q64 102 22 64 Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
    </symbol>
    <!-- 6. 오목 렌즈 (단면 실루엣) -->
    <symbol id="ic6" viewBox="0 0 128 128">
      <path d="M46 22 L82 22 Q70 64 82 106 L46 106 Q58 64 46 22 Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<header>
  <h1>창 투명도 조절기 — 렌즈 아이콘 후보</h1>
  <p class="sub">손잡이 없는 돋보기/렌즈 · 무채색(검정 선) · 완전 미니멀. 32·16px, 밝은/어두운 배경 미리보기 포함. (어두운 배경에선 흰색 톤으로 표시 — 무채색이라 톤만 반전하면 양쪽 다 사용 가능)</p>
</header>

<main class="grid" id="grid"></main>

<footer>
  마음에 드는 <b>번호</b>를 알려주세요 (예: "3번"). 선 두께·안쪽 곡면 정도도 조절 가능합니다. 고르시면 Windows <b>.ico</b>(16·32·48·256px)로 변환해 <b>transparency_utility_v2.exe</b>에 입혀드립니다. (무채색이라 작업표시줄 테마에 맞춰 검정/흰색 톤 선택 가능)
</footer>

<script>
  const items = [
    ['ic1','링 (순수 원)','가장 단순한 렌즈 테두리. 손잡이·색 없음.'],
    ['ic2','이중 링','테두리 안에 얇은 원 하나 더. 렌즈 림 느낌.'],
    ['ic3','오목 면','안쪽 세로 타원으로 오목렌즈 곡면을 암시.'],
    ['ic4','링 + 광택','좌상단 짧은 호로 유리 반사. 글래스 느낌.'],
    ['ic5','볼록 렌즈','가로 렌틸 실루엣. “렌즈” 그 자체.'],
    ['ic6','오목 렌즈','가운데가 잘록한 오목렌즈 단면.'],
  ];
  const grid = document.getElementById('grid');
  items.forEach((it,i)=>{
    const [id,name,desc]=it;
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`
      <div class="num">${i+1}</div>
      <svg class="big" viewBox="0 0 128 128"><use href="#${id}"/></svg>
      <div class="name">${name}</div>
      <div class="desc">${desc}</div>
      <div class="previews">
        <div class="chip light">
          <svg class="s32" viewBox="0 0 128 128"><use href="#${id}"/></svg>
          <svg class="s16" viewBox="0 0 128 128"><use href="#${id}"/></svg>
        </div>
        <div class="chip dark">
          <svg class="s32" viewBox="0 0 128 128"><use href="#${id}"/></svg>
          <svg class="s16" viewBox="0 0 128 128"><use href="#${id}"/></svg>
        </div>
      </div>`;
    grid.appendChild(card);
  });
</script>
</body>
</html>
